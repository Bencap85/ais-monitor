services:

  ais-ws-broadcaster:
    build:
      context: ./ais/ws-broadcaster
      dockerfile: Dockerfile
    env_file:
      - ./ais/ws-broadcaster/.env
    volumes:
      - ./ais/ws-broadcaster/src:/app
    container_name: ais_ws_broadcaster
    ports:
      - "5000:5000"
    restart: unless-stopped
    profiles: ["dev"]

  ais-repository:
    build:
      context: ./ais/repository
      dockerfile: Dockerfile
    env_file:
      - ./ais/repository/.env
    volumes:
      - ./ais/repository/src:/app
    container_name: ais_repository
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgis-db
    profiles: ["dev"]

  ais-ingestor:
    build:
      context: ./ais/ingestor
      dockerfile: Dockerfile
    env_file:
      - ./ais/ingestor/.env
    volumes:
      - ./ais/ingestor/src:/app
    ports:
      - "8081:8081"
    container_name: ais_ingestor
    restart: unless-stopped
    depends_on:
      - ais-repository
    profiles: ["dev"]

  localstack:
    image: localstack/localstack:latest
    container_name: localstack
    ports:
      - "4566:4566"   # Main edge port for all services
      - "4571:4571"   # Optional: pro metrics
    environment:
      - SERVICES=sns,sqs
      - DEBUG=1
      - DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - LS_LOG=info
    volumes:
      - "localstack_data:/var/lib/localstack"        # persistent data
      - "/var/run/docker.sock:/var/run/docker.sock"  # enables some emulation features
    healthcheck:
      test: ["CMD", "bash", "-c", "curl -s http://localhost:4566/health | grep -q '\"initialized\": true'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    profiles: ["infra"]

  postgis-db:
    image: timescale/timescaledb-ha:pg15.15-ts2.24.0
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ais_data
    volumes:
      - ./db/db/init:/docker-entrypoint-initdb.d
      - pgdata:/var/lib/postgresql/data
      - ./db/db/data:/data
    profiles: ["dev"]

volumes:
  localstack_data:
  pgdata:

