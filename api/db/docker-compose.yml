services:
  postgis-db:
    image: postgis/postgis
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ais_data
    volumes:
      - ./db/db/init:/docker-entrypoint-initdb.d
      - pgdata:/var/lib/postgresql/data
      - ./db/db/data:/data

volumes:
  pgdata: