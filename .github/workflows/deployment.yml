name: Backend deployment

permissions: 
  id-token: write 
  contents: read

on:
  push:
    branches:
      - deployment

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::822491881272:role/github-deployment-pipeline
          aws-region: us-east-2

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region us-east-2 \
            | docker login --username AWS --password-stdin 822491881272.dkr.ecr.us-east-2.amazonaws.com

      - name: Build and push images
        run: |
          docker build -f ./api/ais/ingestor/Dockerfile.prod -t ais-ingestor ./api/ais/ingestor
          docker tag ais-ingestor:latest 822491881272.dkr.ecr.us-east-2.amazonaws.com/ais-ingestor:latest
          docker push 822491881272.dkr.ecr.us-east-2.amazonaws.com/ais-ingestor:latest

          docker build -f ./api/ais/repository/Dockerfile.prod -t ais-repository ./api/ais/repository
          docker tag ais-repository:latest 822491881272.dkr.ecr.us-east-2.amazonaws.com/ais-repository:latest
          docker push 822491881272.dkr.ecr.us-east-2.amazonaws.com/ais-repository:latest

          docker build -f ./api/ais/ws-broadcaster/Dockerfile.prod -t ais-ws-broadcaster ./api/ais/ws-broadcaster
          docker tag ais-ws-broadcaster:latest 822491881272.dkr.ecr.us-east-2.amazonaws.com/ais-ws-broadcaster:latest
          docker push 822491881272.dkr.ecr.us-east-2.amazonaws.com/ais-ws-broadcaster:latest

      - name: Add SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2-key.pem
          chmod 600 ~/.ssh/ec2-key.pem

      - name: Add EC2 host to known_hosts
        run: |
          ssh-keyscan -H 3.134.93.191 >> ~/.ssh/known_hosts

      - name: Upload docker compose and scripts to EC2
        run: |
          scp -i ~/.ssh/ec2-key.pem api/generate-env-file.sh ec2-user@3.134.93.191:/home/ec2-user/ais/generate-env-file.sh
          scp -i ~/.ssh/ec2-key.pem api/docker-compose-prod.yml ec2-user@3.134.93.191:/home/ec2-user/ais/docker-compose.yml
 
      - name: Deploy to EC2
        run: |
          ssh -i ~/.ssh/ec2-key.pem ec2-user@3.134.93.191 \
          "mkdir -p ~/ais && cd ~/ais && sudo chmod +x generate-env-file.sh && ./generate-env-file.sh && docker-compose pull && docker-compose up -d"


