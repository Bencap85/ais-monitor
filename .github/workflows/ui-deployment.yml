name: UI Deployment

permissions: 
  id-token: write 
  contents: read

on:
  push:
    branches:
      - deployment
    paths:
      - "ui/**"
      - ".github/workflows/ui-deployment.yml"


jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: |
          cd ui
          cd app
          npm ci

      - name: Build
        env:
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
          DISABLE_ESLINT_PLUGIN: "true"
        run: |
          cd ui
          cd app
          npm run build

      - name: Configure AWS credentials (assume role via OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::822491881272:role/github-deployment-pipeline
          aws-region: us-east-2

      - name: Sync build to S3 (index short cache, assets long cache)
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          cd ui/build

          # upload index.html and other non-fingerprinted files with no-cache
          aws s3 cp index.html s3://$S3_BUCKET/index.html --acl private --cache-control "no-cache, no-store, must-revalidate"
          aws s3 cp manifest.json s3://$S3_BUCKET/manifest.json --acl private --cache-control "no-cache, no-store, must-revalidate" || true
          aws s3 cp favicon.ico s3://$S3_BUCKET/favicon.ico --acl private --cache-control "no-cache, no-store, must-revalidate" || true

          # sync fingerprinted assets with long cache
          if [ -d static ]; then
            aws s3 sync static/ s3://$S3_BUCKET/static/ \
              --acl private \
              --cache-control "public, max-age=31536000, immutable"
          fi

          # sync remaining files and remove deleted objects
          aws s3 sync . s3://$S3_BUCKET/ --delete --exclude "static/*" --exclude "index.html" --exclude "manifest.json" --exclude "favicon.ico"

      - name: Create CloudFront invalidation (skips if no distribution id)
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          if [ -n "${CLOUDFRONT_DISTRIBUTION_ID}" ]; then
            echo "Creating CloudFront invalidation for ${CLOUDFRONT_DISTRIBUTION_ID}"
            aws cloudfront create-invalidation \
              --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
              --paths "/*"
          else
            echo "CLOUDFRONT_DISTRIBUTION_ID not set; skipping invalidation"
          fi
