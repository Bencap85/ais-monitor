name: Build and Deploy UI to S3

on:
  push:
    branches:
      - main
    paths: 
      - "ui/**"
      - ".github/workflows/ui-deployment.yml"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
        run: npm run build

      # - name: Configure AWS credentials
      #   uses: aws-actions/configure-aws-credentials@v2
      #   with:
      #     aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      #     aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      #     aws-region: ${{ secrets.AWS_REGION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::822491881272:role/github-deployment-pipeline
          aws-region: us-east-2

      - name: Sync build to S3 (index short cache, assets long cache)
        run: |
          # upload index.html and other non-fingerprinted files with no-cache
          aws s3 cp build/index.html s3://${{ secrets.S3_BUCKET }}/index.html --acl private --cache-control "no-cache, no-store, must-revalidate"
          aws s3 cp build/manifest.json s3://${{ secrets.S3_BUCKET }}/manifest.json --acl private --cache-control "no-cache, no-store, must-revalidate" || true
          aws s3 cp build/favicon.ico s3://${{ secrets.S3_BUCKET }}/favicon.ico --acl private --cache-control "no-cache, no-store, must-revalidate" || true

          # sync fingerprinted assets with long cache
          aws s3 sync build/static/ s3://${{ secrets.S3_BUCKET }}/static/ \
            --acl private \
            --cache-control "public, max-age=31536000, immutable"

          # remove files not present locally
          aws s3 sync build/ s3://${{ secrets.S3_BUCKET }}/ --delete --exclude "static/*" --exclude "index.html" --exclude "manifest.json" --exclude "favicon.ico"

      - name: Create CloudFront invalidation
        if: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
